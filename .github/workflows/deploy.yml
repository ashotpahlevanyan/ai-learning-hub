name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs npm ci and tests) can only read; only deploy can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Catch settings that would leave the site reading stale or unverifiable database content.
      - name: Check content settings
        env:
          CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ "$CONTENT_SOURCE" = "db" ] && [ "$HAS_DATABASE_URL" != "true" ]; then
            echo "::error::CONTENT_SOURCE=db needs the DATABASE_URL secret, or the database would never get this commit's content."; exit 1
          fi
          if { [ "$CONTENT_SOURCE" = "db" ] || [ "$HAS_DATABASE_URL" = "true" ]; } && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; }; then
            echo "::error::Database content needs the SUPABASE_URL and SUPABASE_ANON_KEY variables."; exit 1
          fi
      # A custom domain (public/CNAME) serves from "/"; otherwise the site lives at /<repo>/.
      - name: Choose base path and site URL
        run: |
          if [ -f public/CNAME ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$(tr -d '[:space:]' < public/CNAME)" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
            echo "SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi
      - run: npm run build
        env:
          # Optional cloud sync; leave the repository variables unset to build without it.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
          # "db" reads exams from the content database (falls back to the bundle); unset keeps bundled content.
          VITE_CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE }}
      # Browser smoke test of the built site; a failure blocks the deploy.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      # Accessibility (axe-core, WCAG 2.2 AA): serious or critical violations block the deploy.
      - run: npm run test:e2e:a11y
      # Database-backed content against a local REST stand-in (builds its own copy in dist-db/).
      - run: npm run test:e2e:db
      # Optional content database: with the DATABASE_URL secret set, every deploy that passed the tests replaces
      # the content tables (one transaction) and then checks that the REST API serves exactly what was bundled.
      - name: Publish content to the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL is not set: skipping."; exit 0; fi
          npm run content:export
          # The schema script is idempotent; re-running it applies columns added since the project was set up.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/content.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f export/load.sql
          npm run content:verify-db
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
